services:
  # PHP App
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: museum-talaga-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - museum-vendor:/var/www/vendor
      - museum-node-modules:/var/www/node_modules
      - ./storage:/var/www/storage
    networks:
      - museum-network
    depends_on:
      - db
    environment:
      - APP_ENV=local
      - APP_DEBUG=true

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: museum-talaga-nginx
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - .:/var/www
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - museum-network
    depends_on:
      - app

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: museum-talaga-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: museum_talaga
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - museum-db-data:/var/lib/mysql
    networks:
      - museum-network

  # phpMyAdmin (opsional, untuk cek DB via browser)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: museum-talaga-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: secret
    networks:
      - museum-network
    depends_on:
      - db

networks:
  museum-network:
    driver: bridge

volumes:
  museum-db-data:
    driver: local
  museum-vendor:
    driver: local
  museum-node-modules:
    driver: local
